# Windows amd64 source contract. Keep Linux archive tooling out of this solve.
channels:
  - conda-forge

dependencies:
  - python=3.13.11
  - pip
  - zstandard=0.25.0
  - pip:
      - robocorp-tasks==4.1.1     # https://pypi.org/project/robocorp-tasks/4.1.1/
      - robocorp-log==3.1.3       # https://pypi.org/project/robocorp-log/3.1.3/
      - robocorp-truststore==0.9.1 # https://pypi.org/project/robocorp-truststore/0.9.1/
      - pydantic==2.12.5

rccPostInstall:
  - python scripts/install_hauler.py
