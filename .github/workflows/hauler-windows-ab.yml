name: Hauler Windows filesystem backport A/B

on:
  push:
    branches: [patchraptor/hauler-windows-ab]

permissions:
  contents: read

jobs:
  windows-ab:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact Hauler source with only the Distribution filesystem backport
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hauler-ab"
          mkdir -p "$root"/{distribution,hauler,evidence,official}
          cd "$root"
          hauler=1af4205802a7c51f2fd5b5a88b27163f33a26aa4
          distribution=3220848f15d9279c66a41aa0a257469e6aede1e9
          fix=f7d69d28c2e302f31d1f6ce8e193da58407225a7
          curl -fsSL --retry 3 "https://codeload.github.com/hauler-dev/hauler/tar.gz/$hauler" -o hauler-source.tgz
          curl -fsSL --retry 3 "https://codeload.github.com/distribution/distribution/tar.gz/$distribution" -o distribution-source.tgz
          curl -fsSL --retry 3 "https://github.com/distribution/distribution/commit/$fix.diff" -o upstream.diff
          curl -fsSL --retry 3 https://github.com/hauler-dev/hauler/releases/download/v2.2.0-dev.5/hauler_2.2.0-dev.5_windows_amd64.tar.gz -o official.tgz
          printf '%s  official.tgz\n' bc531093feee25a22c054557df22b7a4ec9f54f69dd817b0fff97da3e0a3d828 | sha256sum -c -
          printf 'hauler=%s\ndistribution=%s\nfix=%s\njatt=%s\n' "$hauler" "$distribution" "$fix" "$GITHUB_SHA" > evidence/sources.txt
          sha256sum hauler-source.tgz distribution-source.tgz upstream.diff official.tgz > evidence/input-sha256.txt
          tar -xzf hauler-source.tgz -C hauler --strip-components=1
          tar -xzf distribution-source.tgz -C distribution --strip-components=1
          tar -xzf official.tgz -C official hauler.exe
          cp official/hauler.exe official.exe
          (
            cd distribution
            git -c core.autocrlf=false apply --include='*/filesystem/driver.go' --include='*/filesystem/sync.go' --include='*/filesystem/sync_windows.go' ../upstream.diff
            sha256sum -c - <<'SUMS'
          e8da47558118143d2d5ce5c6d5447b9be385220b8046c047395e752ddb94b2a4  registry/storage/driver/filesystem/driver.go
          79254f734a65dddae6e5c6ff81196952d86ff7f20f34e0a18cc790dbd80ef820  registry/storage/driver/filesystem/sync.go
          019c40fa754996cc27e9874be6aba319caf3ef14a4cc15054f8e7125e3fd5a8e  registry/storage/driver/filesystem/sync_windows.go
          SUMS
            sha256sum registry/storage/driver/filesystem/{driver.go,sync.go,sync_windows.go}
          ) > evidence/backport-sha256.txt
          cd hauler
          grep -F 'github.com/distribution/distribution/v3 v3.1.2' go.mod
          go mod edit -replace=github.com/distribution/distribution/v3=../distribution
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o ../backport.exe ./cmd/hauler > ../evidence/build.log 2>&1
          cd ..
          sha256sum official.exe backport.exe > evidence/binary-sha256.txt
          go version -m official.exe backport.exe > evidence/go-build-info.txt
      - name: Run the same synthetic OCI Serve and digest pull
        run: python scripts/qualify_hauler_windows_registry.py "$RUNNER_TEMP/hauler-ab"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hauler-windows-ab-evidence
          path: ${{ runner.temp }}/hauler-ab/evidence
          if-no-files-found: error
