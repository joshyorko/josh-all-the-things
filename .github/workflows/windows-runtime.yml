name: JAT Windows runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "conda.yaml"
      - "robot.yaml"
      - "runtime/rcc.json"
      - "runtime/hauler.json"
      - "scripts/install_hauler.py"
      - "scripts/build_environment_artifact.py"
      - "scripts/publish_environment_artifact.sh"
      - "scripts/publish_environment_artifacts.sh"
      - "src/jat/archive.py"
      - "src/jat/services.py"
      - "tests/**"
      - ".github/workflows/windows-runtime.yml"

permissions:
  contents: read

# One-time publication for the merged RCC/Hauler tranche; keep its source and tag paired.
env:
  JAT_RELEASE_SOURCE_SHA: 5b59fcafc832be67eaca3b8f42ff9f7b06719b76
  JAT_RELEASE_TAG: v0.1.11-jat-runtime

jobs:
  windows-runtime:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout JAT
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && env.JAT_RELEASE_SOURCE_SHA || github.sha }}

      - name: Acquire and verify pinned RCC
        run: |
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $PWD "runtime/rcc.json") | ConvertFrom-Json
          $pin = $manifest.platforms.windows_amd64
          if ($null -eq $pin) { throw "runtime/rcc.json has no windows_amd64 pin" }
          $rcc = Join-Path $env:RUNNER_TEMP "rcc.exe"
          Invoke-WebRequest -Uri $pin.url -OutFile $rcc
          $observed = (Get-FileHash -Algorithm SHA256 -Path $rcc).Hash.ToLowerInvariant()
          if ($observed -ne $pin.sha256) {
            throw "RCC SHA256 mismatch: expected $($pin.sha256), got $observed"
          }
          $output = & $rcc version
          $rccExit = $LASTEXITCODE
          $actualVersion = ($output | Select-Object -First 1).Trim()
          if ($rccExit -ne 0 -or $actualVersion -cne $manifest.version) {
            throw "pinned RCC version check failed: expected $($manifest.version), got $actualVersion"
          }
          "RCC_PATH=$rcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build JAT from the unfrozen contract and generate Windows freeze
        run: |
          $env:ROBOCORP_HOME = Join-Path $env:RUNNER_TEMP "jat-rcc-producer"
          New-Item -ItemType Directory -Force -Path $env:ROBOCORP_HOME | Out-Null
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue output
          & $env:RCC_PATH ht vars --robot (Join-Path $PWD "robot.yaml") *> (Join-Path $env:RUNNER_TEMP "windows-initial-build.log")
          if ($LASTEXITCODE -ne 0) {
            Get-Content (Join-Path $env:RUNNER_TEMP "windows-initial-build.log")
            throw "initial Windows JAT environment construction failed"
          }
          $initialLog = Join-Path $env:RUNNER_TEMP "windows-initial-build.log"
          if (-not (Select-String -Path $initialLog -Pattern "environment_windows_amd64.yaml" -Quiet)) {
            Get-Content $initialLog
            throw "RCC did not select environment_windows_amd64.yaml for the initial Windows solve"
          }
          & $env:RCC_PATH task run --robot (Join-Path $PWD "robot.yaml") --task JAT -- --help *> (Join-Path $env:RUNNER_TEMP "windows-initial-run.log")
          if ($LASTEXITCODE -ne 0) {
            Get-Content (Join-Path $env:RUNNER_TEMP "windows-initial-run.log")
            throw "initial Windows JAT CLI run failed"
          }
          $generated = Join-Path $PWD "output/environment_windows_amd64_freeze.yaml"
          if (-not (Test-Path -LiteralPath $generated -PathType Leaf)) {
            throw "RCC did not generate $generated"
          }
          $freeze = Get-Content -Raw -LiteralPath $generated
          if ($freeze -notmatch "rccPostInstall:" -or $freeze -notmatch "python scripts/install_hauler.py") {
            throw "generated Windows freeze omitted the JAT Hauler post-install contract"
          }
          Copy-Item -LiteralPath $generated -Destination (Join-Path $PWD "environment_windows_amd64_freeze.yaml")
          "WINDOWS_FREEZE=$generated" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove environmentConfigs selected the generated Windows freeze
        run: |
          $env:ROBOCORP_HOME = Join-Path $env:RUNNER_TEMP "jat-rcc-freeze-selection"
          New-Item -ItemType Directory -Force -Path $env:ROBOCORP_HOME | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "windows-freeze-selection.log"
          & $env:RCC_PATH ht vars --robot (Join-Path $PWD "robot.yaml") *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log; throw "Windows freeze selection run failed" }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern "environment_windows_amd64_freeze.yaml" -Quiet)) {
            throw "RCC did not select environment_windows_amd64_freeze.yaml from environmentConfigs"
          }

      - name: Publish and export the Windows JAT Environment Artifact
        run: |
          $env:ROBOCORP_HOME = Join-Path $env:RUNNER_TEMP "jat-rcc-artifact-producer"
          New-Item -ItemType Directory -Force -Path $env:ROBOCORP_HOME | Out-Null
          $publishPath = Join-Path $env:RUNNER_TEMP "windows-publish.json"
          $publishLog = Join-Path $env:RUNNER_TEMP "windows-publish.log"
          & $env:RCC_PATH env publish --robot (Join-Path $PWD "robot.yaml") --provider local --json 1> $publishPath 2> $publishLog
          if ($LASTEXITCODE -ne 0) { Get-Content $publishLog; throw "Windows Environment Artifact publish failed" }
          $published = Get-Content -Raw $publishPath | ConvertFrom-Json
          $artifact = $published.artifactDigest
          if ($artifact -notmatch "^sha256:[0-9a-f]{64}$") { throw "publish returned no canonical artifact digest" }
          $specification = $published.specificationDigest
          $legacyBlueprint = $published.legacyBlueprintKey
          if ($specification -notmatch "^sha256:[0-9a-f]{64}$") { throw "publish returned no canonical specification digest" }
          if ($legacyBlueprint -notmatch "^[0-9a-f]+$") { throw "publish returned no canonical blueprint key" }
          $archive = Join-Path $env:RUNNER_TEMP "jat-runtime-windows.rcca"
          & $env:RCC_PATH env export --artifact $artifact --provider local --output $archive *> (Join-Path $env:RUNNER_TEMP "windows-export.log")
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:RUNNER_TEMP "windows-export.log"); throw "Windows artifact export failed" }
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Windows .rcca export is missing" }
          "WINDOWS_ARTIFACT=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_SPECIFICATION_DIGEST=$specification" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_LEGACY_BLUEPRINT_KEY=$legacyBlueprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fresh acquire, no-build variables, and hauler.exe proof
        run: |
          $env:ROBOCORP_HOME = Join-Path $env:RUNNER_TEMP "jat-rcc-artifact-verifier"
          New-Item -ItemType Directory -Force -Path $env:ROBOCORP_HOME | Out-Null
          $acquirePath = Join-Path $env:RUNNER_TEMP "windows-acquire.json"
          & $env:RCC_PATH env acquire --archive $env:WINDOWS_ARCHIVE --permissive-local --json 1> $acquirePath 2> (Join-Path $env:RUNNER_TEMP "windows-acquire.log")
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:RUNNER_TEMP "windows-acquire.log"); throw "fresh Windows artifact acquire failed" }
          $acquired = Get-Content -Raw $acquirePath | ConvertFrom-Json
          if ($acquired.artifactDigest -ne $env:WINDOWS_ARTIFACT -or $acquired.verification.valid -ne $true) { throw "fresh Windows acquire did not validate the exported artifact" }
          & $env:RCC_PATH --no-build ht vars --robot (Join-Path $PWD "robot.yaml") --json 1> (Join-Path $env:RUNNER_TEMP "windows-no-build-vars.json") 2> (Join-Path $env:RUNNER_TEMP "windows-no-build-vars.log")
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:RUNNER_TEMP "windows-no-build-vars.log"); throw "no-build Windows ht vars failed" }
          $diagnosticReceipt = Join-Path $env:RUNNER_TEMP "windows-hauler-diagnostic.json"
          & $env:RCC_PATH --no-build env exec --artifact $env:WINDOWS_ARTIFACT --permissive-local --inherit-streams --receipt-file $diagnosticReceipt -- python -c "import json,os,shutil; from pathlib import Path; prefix=Path(os.environ['CONDA_PREFIX']); print(json.dumps({'condaPrefix':str(prefix),'scriptsHauler':(prefix/'Scripts'/'hauler.exe').is_file(),'rootHauler':(prefix/'hauler.exe').is_file(),'whichHauler':shutil.which('hauler'),'whichHaulerExe':shutil.which('hauler.exe')}))"
          if ($LASTEXITCODE -ne 0) { Get-Content $diagnosticReceipt; throw "acquired Windows artifact diagnostic command failed" }
          $execPath = Join-Path $env:RUNNER_TEMP "windows-hauler-exec.json"
          & $env:RCC_PATH --no-build env exec --artifact $env:WINDOWS_ARTIFACT --permissive-local --json -- cmd.exe /d /c hauler.exe version 1> $execPath 2> (Join-Path $env:RUNNER_TEMP "windows-hauler-exec.log")
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:RUNNER_TEMP "windows-hauler-exec.log"); throw "hauler.exe version execution failed" }
          $executed = Get-Content -Raw $execPath | ConvertFrom-Json
          if ($executed.artifactDigest -ne $env:WINDOWS_ARTIFACT -or $executed.exitCode -ne 0) { throw "hauler.exe did not execute from the acquired Windows artifact" }
          $haulerVersionCode = "import os, shutil, subprocess, sys; executable = shutil.which('hauler'); prefix = os.environ.get('CONDA_PREFIX'); prefix_root = os.path.realpath(prefix) if prefix else ''; resolved = os.path.realpath(executable) if executable else ''; python_resolved = os.path.realpath(sys.executable); inside = bool(prefix_root and resolved.startswith(prefix_root + os.sep)); python_inside = bool(prefix_root and python_resolved.startswith(prefix_root + os.sep)); sys.exit(127 if not (inside and python_inside) else subprocess.run([resolved, 'version'], check=False).returncode)"
          $pythonExecPath = Join-Path $env:RUNNER_TEMP "windows-hauler-python-exec.json"
          & $env:RCC_PATH --no-build env exec --artifact $env:WINDOWS_ARTIFACT --permissive-local --json -- python -c $haulerVersionCode 1> $pythonExecPath 2> (Join-Path $env:RUNNER_TEMP "windows-hauler-python-exec.log")
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:RUNNER_TEMP "windows-hauler-python-exec.log"); throw "artifact Python Hauler version proof failed" }
          $pythonExecuted = Get-Content -Raw $pythonExecPath | ConvertFrom-Json
          if ($pythonExecuted.artifactDigest -ne $env:WINDOWS_ARTIFACT -or $pythonExecuted.exitCode -ne 0) { throw "artifact Python Hauler version proof did not validate" }
          $executed

      - name: Probe Hauler Windows local file ingestion
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP "hauler file probe"
          $store = Join-Path $probeRoot "store"
          $temp = Join-Path $probeRoot "temp"
          $payload = Join-Path $probeRoot "payload file.txt"
          New-Item -ItemType Directory -Force -Path $probeRoot, $store, $temp | Out-Null
          Set-Content -LiteralPath $payload -Value "hauler-windows-file-probe" -Encoding utf8
          $env:ROBOCORP_HOME = Join-Path $env:RUNNER_TEMP "jat-rcc-artifact-verifier"
          $storeLiteral = $store | ConvertTo-Json -Compress
          $tempLiteral = $temp | ConvertTo-Json -Compress
          $payloadLiteral = $payload | ConvertTo-Json -Compress
          $launcher = "import os,shutil,subprocess; from pathlib import Path; payload=Path($payloadLiteral); executable=shutil.which('hauler.exe'); prefix=os.path.realpath(os.environ['CONDA_PREFIX']); resolved=os.path.realpath(executable); assert resolved.startswith(prefix + os.sep); subprocess.run([shutil.which('hauler.exe'), '--store', $storeLiteral, '--tempdir', $tempLiteral, 'store', 'add', 'file', payload.name, '--name', 'probe.txt'], cwd=str(payload.parent), check=True)"
          $log = Join-Path $env:RUNNER_TEMP "windows-hauler-add-file-probe.log"
          $receipt = Join-Path $env:RUNNER_TEMP "windows-hauler-add-file-probe.json"
          & $env:RCC_PATH --no-build env exec --artifact $env:WINDOWS_ARTIFACT --permissive-local --inherit-streams --receipt-file $receipt -- python -c $launcher *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log; throw "Hauler Windows store add file probe failed" }

      - name: Run real JAT Doctor, Build, Restore, and Serve smoke
        run: |
          $env:ROBOCORP_HOME = Join-Path $env:RUNNER_TEMP "jat-rcc-artifact-verifier"
          & $env:RCC_PATH --no-build env exec --artifact $env:WINDOWS_ARTIFACT --permissive-local --json -- python -c "import zstandard" *> (Join-Path $env:RUNNER_TEMP "windows-tool-check.log")
          if ($LASTEXITCODE -ne 0) {
            Get-Content (Join-Path $env:RUNNER_TEMP "windows-tool-check.log")
            throw "acquired Windows artifact lacks its contained zstandard archive backend"
          }
          & $env:RCC_PATH task run --robot (Join-Path $PWD "robot.yaml") --task Doctor --dev --silent
          if ($LASTEXITCODE -ne 0) { throw "JAT Doctor failed on Windows" }
          $source = Join-Path $PWD "devdata/synthetic-source"
          $haul = Join-Path $env:RUNNER_TEMP "windows-jat.tar.zst"
          $buildRequest = Join-Path $env:RUNNER_TEMP "windows-build.json"
          @{ folder = $source; output = $haul; rcc_environment = "off" } | ConvertTo-Json | Out-File $buildRequest -Encoding utf8
          & $env:RCC_PATH task run --robot (Join-Path $PWD "robot.yaml") --task Build -- --json-input $buildRequest
          if ($LASTEXITCODE -ne 0) { throw "JAT Build failed on Windows" }
          $restore = Join-Path $env:RUNNER_TEMP "windows-restored"
          $restoreRequest = Join-Path $env:RUNNER_TEMP "windows-restore.json"
          @{ haul = $haul; destination = $restore } | ConvertTo-Json | Out-File $restoreRequest -Encoding utf8
          & $env:RCC_PATH task run --robot (Join-Path $PWD "robot.yaml") --task Restore -- --json-input $restoreRequest
          if ($LASTEXITCODE -ne 0) { throw "JAT Restore failed on Windows" }
          $serveRequest = Join-Path $env:RUNNER_TEMP "windows-serve.json"
          @{ haul = $haul } | ConvertTo-Json | Out-File $serveRequest -Encoding utf8
          $serveRunDir = Join-Path $env:RUNNER_TEMP "jat-serve-runtime"
          New-Item -ItemType Directory -Force -Path $serveRunDir | Out-Null
          $env:JAT_RUN_DIR = $serveRunDir
          $serveOut = Join-Path $env:RUNNER_TEMP "windows-serve.out"
          $serveErr = Join-Path $env:RUNNER_TEMP "windows-serve.err"
          $serveArgs = @("task", "run", "--robot", (Join-Path $PWD "robot.yaml"), "--task", "Serve", "--", "--json-input", $serveRequest)
          $env:JAT_HAULER_LOG_LEVEL = "debug"
          $serve = Start-Process -FilePath $env:RCC_PATH -ArgumentList $serveArgs -WorkingDirectory $PWD -RedirectStandardOutput $serveOut -RedirectStandardError $serveErr -PassThru
          $ready = $false
          $workspaceUrl = "http://127.0.0.1:8080/joshs-all-the-things-workspace.tar.zst"
          $downloadedWorkspace = Join-Path $env:RUNNER_TEMP "windows-served-workspace.tar.zst"
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if ($serve.HasExited) { Get-Content $serveOut, $serveErr; throw "JAT Serve exited before fileserver readiness" }
            try {
              Invoke-WebRequest -Uri $workspaceUrl -OutFile $downloadedWorkspace -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop | Out-Null
              if ((Test-Path -LiteralPath $downloadedWorkspace -PathType Leaf) -and (Get-Item -LiteralPath $downloadedWorkspace).Length -gt 0) {
                $ready = $true
                break
              }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { Get-Content $serveOut, $serveErr; throw "JAT Serve fileserver did not serve $workspaceUrl" }
          & taskkill.exe /PID $serve.Id /T /F | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not stop the Windows Serve smoke process" }
          $archiveInfo = [ordered]@{
            filename = Split-Path -Leaf $env:WINDOWS_ARCHIVE
            sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:WINDOWS_ARCHIVE).Hash.ToLowerInvariant()
            size = [int64](Get-Item -LiteralPath $env:WINDOWS_ARCHIVE).Length
          }
          $haulerVersionCode = "import os, shutil, subprocess, sys; executable = shutil.which('hauler'); prefix = os.environ.get('CONDA_PREFIX'); prefix_root = os.path.realpath(prefix) if prefix else ''; resolved = os.path.realpath(executable) if executable else ''; python_resolved = os.path.realpath(sys.executable); inside = bool(prefix_root and resolved.startswith(prefix_root + os.sep)); python_inside = bool(prefix_root and python_resolved.startswith(prefix_root + os.sep)); sys.exit(127 if not (inside and python_inside) else subprocess.run([resolved, 'version'], check=False).returncode)"
          $warmExecutionPath = Join-Path $env:RUNNER_TEMP "windows-warm-reuse.json"
          $trustCarrier = Join-Path $env:ROBOCORP_HOME "artifacts\v1\content\trust"
          & $env:RCC_PATH --no-build env exec --artifact $env:WINDOWS_ARTIFACT --permissive-local --provider "http://127.0.0.1:1" --trust-carrier $trustCarrier --trust-carrier-type filesystem --json -- python -c "print('jat-warm-reuse-proof')" 1> $warmExecutionPath 2> (Join-Path $env:RUNNER_TEMP "windows-warm-reuse.log")
          if ($LASTEXITCODE -ne 0) { throw "warm no-build execution with an unreachable provider failed" }
          $warmExecution = Get-Content -Raw $warmExecutionPath | ConvertFrom-Json
          if ($warmExecution.artifactDigest -ne $env:WINDOWS_ARTIFACT -or $warmExecution.exitCode -ne 0) { throw "warm no-build execution did not reuse the verified artifact" }
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $PWD "runtime/rcc.json") | ConvertFrom-Json
          $haulerManifest = Get-Content -Raw -LiteralPath (Join-Path $PWD "runtime/hauler.json") | ConvertFrom-Json
          $receipt = [ordered]@{
            format_version = 3
            operation = "build"
            success = $true
            jat_git_sha = (& git rev-parse HEAD).Trim()
            rcc_executable = $env:RCC_PATH
            rcc_version = $manifest.version
            hauler_version = $haulerManifest.hauler.version
            rcc_source = [ordered]@{
              repository = $manifest.source.repository
              tag = $manifest.source.tag
              commit = $manifest.source.commit
              asset = $manifest.platforms.windows_amd64.asset
              sha256 = $manifest.platforms.windows_amd64.sha256
            }
            platform = "windows_amd64"
            artifact_digest = $env:WINDOWS_ARTIFACT
            specification_digest = $env:WINDOWS_SPECIFICATION_DIGEST
            legacy_blueprint_key = $env:WINDOWS_LEGACY_BLUEPRINT_KEY
            archive = $archiveInfo
            verified_acquire = [ordered]@{ fresh_home = $true; no_build = $true }
            verified_no_build = [ordered]@{ fresh_home = $true; no_build = $true }
            verified_exec = [ordered]@{ fresh_home = $true }
            verified_warm_reuse = [ordered]@{ fresh_home = $true; no_build = $true; provider_unavailable = $true }
            verified_hauler = [ordered]@{
              fresh_home = $true
              command = @("hauler", "version")
              launcher = @("python", "-c", $haulerVersionCode)
              resolved_under_conda_prefix = $true
              exit_code = 0
            }
            verified_tasks = [ordered]@{ doctor = $true; build = $true; restore = $true; serve = $true }
          }
          $receiptPath = Join-Path $env:RUNNER_TEMP "jat-runtime-windows.json"
          $receipt | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $receiptPath -Encoding utf8
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) { throw "Windows runtime receipt was not written" }

      - name: Upload generated Windows freeze and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jat-windows-runtime-evidence
          if-no-files-found: warn
          path: |
            output/environment_windows_amd64_freeze.yaml
            environment_windows_amd64_freeze.yaml
            ${{ runner.temp }}/jat-runtime-windows.rcca
            ${{ runner.temp }}/jat-runtime-windows.json
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/windows-serve.*

  linux-runtime:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout JAT
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && env.JAT_RELEASE_SOURCE_SHA || github.sha }}

      - name: Acquire and verify pinned RCC
        run: |
          set -euo pipefail
          mapfile -t pin < <(python3 -c 'import json; p=json.load(open("runtime/rcc.json"))["platforms"]["linux_amd64"]; print(json.load(open("runtime/rcc.json"))["version"]); print(p["url"]); print(p["sha256"])')
          rcc_version="${pin[0]}"
          rcc_url="${pin[1]}"
          rcc_sha256="${pin[2]}"
          rcc_path="$RUNNER_TEMP/rcc"
          curl --fail --location --silent --show-error --retry 3 "$rcc_url" --output "$rcc_path"
          printf '%s  %s\n' "$rcc_sha256" "$rcc_path" | sha256sum --check --status -
          chmod 0755 "$rcc_path"
          actual_version=$("$rcc_path" version | head -n 1)
          [[ "$actual_version" == "$rcc_version" ]] || { echo "RCC version mismatch: expected $rcc_version, got $actual_version" >&2; exit 1; }
          {
            echo "RCC_PATH=$rcc_path"
            echo "RCC_VERSION=$rcc_version"
          } >> "$GITHUB_ENV"

      - name: Prove the tracked Linux freeze is selected
        run: |
          set -euo pipefail
          export ROBOCORP_HOME="$RUNNER_TEMP/jat-linux-freeze-selection"
          mkdir -p "$ROBOCORP_HOME"
          "$RCC_PATH" ht vars --robot "$PWD/robot.yaml" 2>&1 | tee "$RUNNER_TEMP/linux-freeze-selection.log"
          grep -Fq 'environment_linux_amd64_freeze.yaml' "$RUNNER_TEMP/linux-freeze-selection.log"

      - name: Publish, export, and internally verify the Linux JAT artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/build_environment_artifact.py \
            --robot "$PWD/robot.yaml" \
            --rcc "$RCC_PATH" \
            --output "$PWD/dist/jat-runtime.rcca" \
            --receipt "$PWD/dist/jat-runtime.json" \
            --timeout 1800 | tee "$RUNNER_TEMP/linux-artifact-builder.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("dist/jat-runtime.json").read_text())
          assert receipt["platform"] == "linux_amd64"
          assert receipt["rcc_version"] == "v18.19.5"
          assert receipt["rcc_source"]["commit"] == "d1aec7d0bb897a81274423c7a6bb747233f9c263"
          assert receipt["hauler_version"] == "v2.1.1"
          assert receipt["verified_acquire"] == {"fresh_home": True, "no_build": True}
          assert receipt["verified_no_build"] == {"fresh_home": True, "no_build": True}
          assert receipt["verified_warm_reuse"]["no_build"] is True
          assert receipt["verified_hauler"]["resolved_under_conda_prefix"] is True
          assert Path("dist/jat-runtime.rcca").is_file()
          print(json.dumps({"artifact_digest": receipt["artifact_digest"], "archive": receipt["archive"]}, sort_keys=True))
          PY

      - name: Fresh acquire, no-build variables, and Hauler proof from exported artifact
        run: |
          set -euo pipefail
          export ROBOCORP_HOME="$RUNNER_TEMP/jat-linux-verifier"
          mkdir -p "$ROBOCORP_HOME"
          artifact=$(python3 -c 'import json; print(json.load(open("dist/jat-runtime.json"))["artifact_digest"])')
          "$RCC_PATH" env acquire --archive "$PWD/dist/jat-runtime.rcca" --permissive-local --json > "$RUNNER_TEMP/linux-acquire.json"
          python3 - "$RUNNER_TEMP/linux-acquire.json" "$artifact" <<'PY'
          import json
          import sys

          acquired = json.load(open(sys.argv[1]))
          assert acquired["artifactDigest"] == sys.argv[2]
          assert acquired["verification"]["valid"] is True
          PY
          "$RCC_PATH" --no-build ht vars --robot "$PWD/robot.yaml" --json > "$RUNNER_TEMP/linux-no-build-vars.json"
          hauler_probe="import os, shutil, subprocess, sys; executable = shutil.which('hauler'); prefix = os.environ.get('CONDA_PREFIX'); prefix_root = os.path.realpath(prefix) if prefix else ''; resolved = os.path.realpath(executable) if executable else ''; python_resolved = os.path.realpath(sys.executable); inside = bool(prefix_root and resolved.startswith(prefix_root + os.sep)); python_inside = bool(prefix_root and python_resolved.startswith(prefix_root + os.sep)); sys.exit(127 if not (inside and python_inside) else subprocess.run([resolved, 'version'], check=False).returncode)"
          "$RCC_PATH" --no-build env exec --artifact "$artifact" --permissive-local --json -- python -c "$hauler_probe" > "$RUNNER_TEMP/linux-hauler-exec.json"
          python3 - "$RUNNER_TEMP/linux-hauler-exec.json" "$artifact" <<'PY'
          import json
          import sys

          execution = json.load(open(sys.argv[1]))
          assert execution["artifactDigest"] == sys.argv[2]
          assert execution["exitCode"] == 0
          PY

      - name: Run real Linux Doctor, Build, Restore, and Serve smoke
        run: |
          set -euo pipefail
          export ROBOCORP_HOME="$RUNNER_TEMP/jat-linux-verifier"
          artifact=$(python3 -c 'import json; print(json.load(open("dist/jat-runtime.json"))["artifact_digest"])')
          "$RCC_PATH" --no-build task run --robot "$PWD/robot.yaml" --task Doctor --dev --silent
          source="$PWD/devdata/synthetic-source"
          haul="$RUNNER_TEMP/linux-jat.tar.zst"
          build_request="$RUNNER_TEMP/linux-build.json"
          python3 - "$build_request" "$source" "$haul" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({"folder": sys.argv[2], "output": sys.argv[3], "rcc_environment": "off"}))
          PY
          "$RCC_PATH" --no-build task run --robot "$PWD/robot.yaml" --task Build -- --json-input "$build_request"
          restore="$RUNNER_TEMP/linux-restored"
          restore_request="$RUNNER_TEMP/linux-restore.json"
          python3 - "$restore_request" "$haul" "$restore" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({"haul": sys.argv[2], "destination": sys.argv[3]}))
          PY
          "$RCC_PATH" --no-build task run --robot "$PWD/robot.yaml" --task Restore -- --json-input "$restore_request"
          serve_request="$RUNNER_TEMP/linux-serve.json"
          python3 - "$serve_request" "$haul" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({"haul": sys.argv[2]}))
          PY
          export JAT_RUN_DIR="$RUNNER_TEMP/jat-linux-serve-runtime"
          export JAT_HAULER_LOG_LEVEL=debug
          mkdir -p "$JAT_RUN_DIR"
          serve_log="$RUNNER_TEMP/linux-serve.log"
          "$RCC_PATH" --no-build task run --robot "$PWD/robot.yaml" --task Serve -- --json-input "$serve_request" > "$serve_log" 2>&1 &
          serve_pid=$!
          cleanup() {
            if kill -0 "$serve_pid" 2>/dev/null; then
              kill "$serve_pid" 2>/dev/null || true
            fi
            wait "$serve_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          served="$RUNNER_TEMP/linux-served-workspace.tar.zst"
          ready=false
          for attempt in $(seq 1 30); do
            if ! kill -0 "$serve_pid" 2>/dev/null; then
              cat "$serve_log"
              echo "JAT Serve exited before fileserver readiness" >&2
              exit 1
            fi
            if curl --fail --silent --show-error --output "$served" --max-time 2 \
              http://127.0.0.1:8080/joshs-all-the-things-workspace.tar.zst && [[ -s "$served" ]]; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || { cat "$serve_log"; echo "JAT Serve fileserver did not serve a non-empty workspace artifact" >&2; exit 1; }

      - name: Run real registry-first manifest bootstrap
        run: |
          set -euo pipefail
          command -v docker
          command -v htpasswd
          docker info >/dev/null
          artifact=$(python3 -c 'import json; print(json.load(open("dist/jat-runtime.json"))["artifact_digest"])')
          export JAT_TEST_DOCKER="$(command -v docker)"
          export JAT_TEST_HTPASSWD="$(command -v htpasswd)"
          export ROBOCORP_HOME="$RUNNER_TEMP/jat-linux-verifier"
          "$RCC_PATH" --no-build env exec --artifact "$artifact" --permissive-local --json -- python -m pip install --quiet pytest
          test_receipt="$RUNNER_TEMP/registry-first-manifest-receipt.json"
          "$RCC_PATH" --no-build env exec --artifact "$artifact" --permissive-local --inherit-streams --receipt-file "$test_receipt" -- \
            env PYTHONPATH="$GITHUB_WORKSPACE/src" python -m pytest -q "$GITHUB_WORKSPACE/tests/test_real_vertical.py" -k manifest_local_publish
          python3 - "$test_receipt" <<'PY'
          import json
          import sys
          receipt = json.load(open(sys.argv[1]))
          assert receipt["exitCode"] == 0, receipt
          PY

      - name: Upload Linux artifact and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jat-linux-runtime-evidence
          if-no-files-found: warn
          path: |
            dist/jat-runtime.rcca
            dist/jat-runtime.json
            output/environment_linux_amd64_freeze.yaml
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.json

  publish-jat-runtime:
    if: github.event_name == 'workflow_dispatch'
    needs: [windows-runtime, linux-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout the exact merged JAT source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.JAT_RELEASE_SOURCE_SHA }}

      - name: Download the exact-source Linux and Windows runtime evidence
        uses: actions/download-artifact@v4
        with:
          name: jat-linux-runtime-evidence
          path: ${{ runner.temp }}/jat-linux-runtime-evidence

      - name: Download the exact-source Windows runtime evidence
        uses: actions/download-artifact@v4
        with:
          name: jat-windows-runtime-evidence
          path: ${{ runner.temp }}/jat-windows-runtime-evidence

      - name: Check release sequence and assemble verified inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$JAT_RELEASE_TAG" >/dev/null 2>&1; then
            existing_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$JAT_RELEASE_TAG\") | .id" | head -n 1)
            [[ -n "$existing_id" ]] || { echo "Release tag exists without a matching GitHub release" >&2; exit 1; }
            existing_immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/$existing_id" --jq .immutable)
            [[ "$existing_immutable" == true ]] || { echo "Release tag already exists but is not immutable" >&2; exit 1; }
          fi
          mkdir -p dist/publish/linux dist/publish/windows dist/release-assets
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          source_sha = "5b59fcafc832be67eaca3b8f42ff9f7b06719b76"
          inputs = {
              "linux": (Path("${{ runner.temp }}/jat-linux-runtime-evidence"), "jat-runtime.rcca", "jat-runtime.json", "linux_amd64"),
              "windows": (Path("${{ runner.temp }}/jat-windows-runtime-evidence"), "jat-runtime-windows.rcca", "jat-runtime-windows.json", "windows_amd64"),
          }
          release = Path("dist/release-assets")
          receipt_names = {"linux": "jat-runtime-linux-amd64.json", "windows": "jat-runtime-windows-amd64.json"}
          archive_names = {"linux": "jat-runtime-linux-amd64.rcca", "windows": "jat-runtime-windows-amd64.rcca"}
          for name, (root, archive_file, receipt_file, platform) in inputs.items():
              archives = list(root.rglob(archive_file))
              receipts = list(root.rglob(receipt_file))
              if len(archives) != 1 or len(receipts) != 1:
                  raise SystemExit(f"expected one {archive_file} and one {receipt_file} under {root}")
              receipt = json.loads(receipts[0].read_text(encoding="utf-8-sig"))
              archive = archives[0]
              actual_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
              if receipt["jat_git_sha"] != source_sha:
                  raise SystemExit(f"{name} receipt source SHA mismatch: {receipt['jat_git_sha']}")
              if receipt["platform"] != platform or receipt["rcc_version"] != "v18.19.5" or receipt["hauler_version"] != "v2.1.1":
                  raise SystemExit(f"{name} receipt runtime identity mismatch")
              if receipt["archive"]["filename"] != archive_file:
                  raise SystemExit(f"{name} receipt archive filename mismatch")
              if receipt["archive"]["sha256"] != actual_sha or receipt["archive"]["size"] != archive.stat().st_size:
                  raise SystemExit(f"{name} archive does not match its receipt")
              if receipt["verified_acquire"] != {"fresh_home": True, "no_build": True}:
                  raise SystemExit(f"{name} fresh acquire proof is incomplete")
              if receipt["verified_no_build"] != {"fresh_home": True, "no_build": True}:
                  raise SystemExit(f"{name} no-build proof is incomplete")
              if not receipt["verified_hauler"]["resolved_under_conda_prefix"]:
                  raise SystemExit(f"{name} Hauler was not verified inside the acquired runtime")
              publish_dir = Path("dist/publish") / name
              publish_dir.mkdir(parents=True, exist_ok=True)
              shutil.copy2(archive, publish_dir / archive_file)
              shutil.copy2(receipts[0], publish_dir / receipt_file)
              shutil.copy2(archive, release / archive_names[name])
              shutil.copy2(receipts[0], release / receipt_names[name])
          linux_freeze = Path("environment_linux_amd64_freeze.yaml")
          if not linux_freeze.is_file():
              raise SystemExit("tracked Linux freeze is missing")
          shutil.copy2(linux_freeze, release / linux_freeze.name)
          windows_root = Path("${{ runner.temp }}/jat-windows-runtime-evidence")
          windows_freezes = list(windows_root.rglob("environment_windows_amd64_freeze.yaml"))
          if not windows_freezes:
              raise SystemExit("generated Windows freeze is missing")
          freeze_bytes = windows_freezes[0].read_bytes()
          if any(item.read_bytes() != freeze_bytes for item in windows_freezes[1:]):
              raise SystemExit("Windows freeze copies disagree")
          shutil.copy2(windows_freezes[0], release / "environment_windows_amd64_freeze.yaml")
          PY

      - name: Install checksum-pinned ORAS
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oras_1.3.2_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/oras-project/oras/releases/download/v1.3.2/oras_1.3.2_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 9229ccc6d17bb282039ad4a69abb16dcb887a5bce567c075d731d9b3c7ad8eaf "$archive" | sha256sum --check --status -
          tar -xzf "$archive" -C "$RUNNER_TEMP" oras
          sudo install "$RUNNER_TEMP/oras" /usr/local/bin/oras
          oras version

      - name: Publish the existing immutable GHCR artifact carriers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish_environment_artifact.sh
          scripts/publish_environment_artifacts.sh \
            --linux-archive dist/publish/linux/jat-runtime.rcca \
            --linux-receipt dist/publish/linux/jat-runtime.json \
            --windows-archive dist/publish/windows/jat-runtime-windows.rcca \
            --windows-receipt dist/publish/windows/jat-runtime-windows.json \
            | tee dist/carriers.txt

      - name: Create provenance and release checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          assets = Path("dist/release-assets")
          carrier_lines = [
              line for line in Path("dist/carriers.txt").read_text().splitlines()
              if line.startswith("ghcr.io/joshyorko/josh-all-the-things-jat-runtime@sha256:")
          ]
          if len(carrier_lines) != 2 or any(
              len(line.rsplit("@sha256:", 1)[-1]) != 64
              or any(char not in "0123456789abcdef" for char in line.rsplit("@sha256:", 1)[-1])
              for line in carrier_lines
          ):
              raise SystemExit("expected two immutable GHCR repository@sha256 references")
          # publish_environment_artifacts.sh processes Linux, then Windows.
          carriers = {"linux_amd64": carrier_lines[0], "windows_amd64": carrier_lines[1]}
          platforms = {}
          for platform, receipt_name, archive_name in (
              ("linux_amd64", "jat-runtime-linux-amd64.json", "jat-runtime-linux-amd64.rcca"),
              ("windows_amd64", "jat-runtime-windows-amd64.json", "jat-runtime-windows-amd64.rcca"),
          ):
              receipt = json.loads((assets / receipt_name).read_text(encoding="utf-8-sig"))
              platforms[platform] = {
                  "receipt": receipt_name,
                  "artifact_digest": receipt["artifact_digest"],
                  "specification_digest": receipt["specification_digest"],
                  "archive": {
                      "asset": archive_name,
                      "sha256": receipt["archive"]["sha256"],
                      "size": receipt["archive"]["size"],
                  },
                  "ghcr_carrier": carriers[platform],
              }
          provenance = {
              "format_version": 1,
              "release_tag": "v0.1.11-jat-runtime",
              "jat_git_sha": "5b59fcafc832be67eaca3b8f42ff9f7b06719b76",
              "workflow_run": {
                  "id": int("${{ github.run_id }}"),
                  "url": f"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              },
              "rcc_version": "v18.19.5",
              "hauler_version": "v2.1.1",
              "platforms": platforms,
          }
          (assets / "jat-runtime-provenance.json").write_text(json.dumps(provenance, indent=2, sort_keys=True) + "\n")
          PY
          (cd dist/release-assets && sha256sum environment_linux_amd64_freeze.yaml environment_windows_amd64_freeze.yaml jat-runtime-linux-amd64.json jat-runtime-linux-amd64.rcca jat-runtime-windows-amd64.json jat-runtime-windows-amd64.rcca jat-runtime-provenance.json | sort -k2 > SHA256SUMS)

      - name: Create and publish the immutable JAT runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/jat-runtime-release-notes.md"
          python3 - "$notes" "$JAT_RELEASE_SOURCE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" dist/carriers.txt <<'PY'
          import pathlib
          import sys

          notes_path, source_sha, repository, run_id, carriers_path = sys.argv[1:]
          carriers = pathlib.Path(carriers_path).read_text().strip()
          if not carriers:
              raise SystemExit("GHCR carrier list is empty")
          tick = chr(96)
          body = (
              "## JAT v0.1.11 runtime artifacts\n\n"
              f"Linux amd64 and Windows amd64 RCC Environment Artifacts built and verified from merged-main source {tick}{source_sha}{tick} using Josh RCC v18.19.5 and Hauler v2.1.1.\n\n"
              f"Workflow proof: https://github.com/{repository}/actions/runs/{run_id}\n\n"
              "Both receipts bind the JAT source SHA, RCC release source and binary checksum, Hauler version, artifact/specification identities, archive SHA-256/size, fresh acquire, no-build, environment-owned Hauler, and warm provider-unavailable proof. "
              + tick + "SHA256SUMS" + tick + " covers every attached runtime asset other than itself.\n\n"
              "GHCR carriers:\n\n"
              + tick * 3 + "\n" + carriers + "\n" + tick * 3 + "\n"
          )
          pathlib.Path(notes_path).write_text(body)
          PY
          release_list="$RUNNER_TEMP/releases.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$release_list"
          release_id=$(jq -r --arg tag "$JAT_RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | first | .id // empty' "$release_list")
          if [[ -z "$release_id" ]]; then
            gh release create "$JAT_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$JAT_RELEASE_SOURCE_SHA" \
              --draft --prerelease \
              --title "JAT v0.1.11 Linux and Windows runtime artifacts" \
              --notes-file "$notes" \
              dist/release-assets/environment_linux_amd64_freeze.yaml \
              dist/release-assets/environment_windows_amd64_freeze.yaml \
              dist/release-assets/jat-runtime-linux-amd64.json \
              dist/release-assets/jat-runtime-linux-amd64.rcca \
              dist/release-assets/jat-runtime-windows-amd64.json \
              dist/release-assets/jat-runtime-windows-amd64.rcca \
              dist/release-assets/jat-runtime-provenance.json \
              dist/release-assets/SHA256SUMS
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$release_list"
            release_id=$(jq -r --arg tag "$JAT_RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | first | .id // empty' "$release_list")
          fi
          [[ -n "$release_id" ]] || { echo "Release ID was not returned by GitHub" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$JAT_RELEASE_SOURCE_SHA" "$GITHUB_WORKSPACE" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1]))
          source_sha = sys.argv[2]
          expected = {
              "environment_linux_amd64_freeze.yaml", "environment_windows_amd64_freeze.yaml",
              "jat-runtime-linux-amd64.json", "jat-runtime-linux-amd64.rcca",
              "jat-runtime-windows-amd64.json", "jat-runtime-windows-amd64.rcca",
              "jat-runtime-provenance.json", "SHA256SUMS",
          }
          if release["tag_name"] != "v0.1.11-jat-runtime" or not release["target_commitish"].startswith(source_sha[:7]):
              raise SystemExit("draft release tag or source commit does not match the JAT release")
          assets = {asset["name"] for asset in release["assets"]}
          if assets != expected:
              raise SystemExit(f"release assets do not match the eight expected files: {sorted(assets)}")
          if not release["draft"] and not release.get("immutable", False):
              raise SystemExit("an existing published release is not immutable")
          PY
          if [[ $(jq -r .draft "$RUNNER_TEMP/release.json") == true ]]; then
            python3 - "$notes" "$RUNNER_TEMP/release-patch.json" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[2]).write_text(json.dumps({
              "body": pathlib.Path(sys.argv[1]).read_text(), "draft": False, "prerelease": True
          }))
          PY
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input "$RUNNER_TEMP/release-patch.json" >/dev/null
          fi
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .immutable)
          [[ "$immutable" == true ]] || { echo "GitHub did not lock the published release as immutable" >&2; exit 1; }

  verify-published-linux:
    if: github.event_name == 'workflow_dispatch'
    needs: publish-jat-runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the exact merged JAT source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.JAT_RELEASE_SOURCE_SHA }}

      - name: Download the published Linux archive and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jat-runtime-linux"
          gh release download "$JAT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern jat-runtime-linux-amd64.rcca \
            --pattern jat-runtime-linux-amd64.json \
            --dir "$RUNNER_TEMP/jat-runtime-linux"

      - name: Verify fresh Linux acquire, no-build, Hauler, and real JAT tasks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/jat-runtime-linux/jat-runtime-linux-amd64.rcca"
          receipt="$RUNNER_TEMP/jat-runtime-linux/jat-runtime-linux-amd64.json"
          python3 - "$archive" "$receipt" "$JAT_RELEASE_SOURCE_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          archive, receipt, source_sha = pathlib.Path(sys.argv[1]), json.loads(pathlib.Path(sys.argv[2]).read_text()), sys.argv[3]
          assert receipt["jat_git_sha"] == source_sha
          assert receipt["hauler_version"] == "v2.1.1"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == receipt["archive"]["sha256"]
          assert archive.stat().st_size == receipt["archive"]["size"]
          PY
          mapfile -t pin < <(python3 -c 'import json; p=json.load(open("runtime/rcc.json")); x=p["platforms"]["linux_amd64"]; print(p["version"]); print(x["url"]); print(x["sha256"])')
          rcc="$RUNNER_TEMP/rcc"
          curl --fail --location --silent --show-error --retry 3 "${pin[1]}" --output "$rcc"
          printf '%s  %s\n' "${pin[2]}" "$rcc" | sha256sum --check --status -
          chmod 0755 "$rcc"
          [[ "$($rcc version | head -n 1)" == "${pin[0]}" ]]
          export ROBOCORP_HOME="$RUNNER_TEMP/jat-release-linux-verifier"
          mkdir -p "$ROBOCORP_HOME"
          "$rcc" env acquire --archive "$archive" --permissive-local --json > "$RUNNER_TEMP/linux-release-acquire.json"
          artifact=$(python3 -c 'import json; print(json.load(open("'"$receipt"'"))["artifact_digest"])')
          python3 - "$RUNNER_TEMP/linux-release-acquire.json" "$artifact" <<'PY'
          import json, sys
          acquired = json.load(open(sys.argv[1]))
          assert acquired["artifactDigest"] == sys.argv[2] and acquired["verification"]["valid"] is True
          PY
          "$rcc" --no-build ht vars --robot "$PWD/robot.yaml" --json > "$RUNNER_TEMP/linux-release-vars.json"
          hauler_probe="import os,shutil,subprocess,sys; e=shutil.which('hauler'); p=os.path.realpath(os.environ['CONDA_PREFIX']); r=os.path.realpath(e) if e else ''; result=subprocess.run([r,'version'],check=False,capture_output=True,text=True) if r.startswith(p+os.sep) else None; sys.exit(127 if result is None else (result.returncode if '2.1.1' in result.stdout else 1))"
          "$rcc" --no-build env exec --artifact "$artifact" --permissive-local --json -- python -c "$hauler_probe" > "$RUNNER_TEMP/linux-release-hauler.json"
          python3 - "$RUNNER_TEMP/linux-release-hauler.json" "$artifact" <<'PY'
          import json, sys
          execution = json.load(open(sys.argv[1]))
          assert execution["artifactDigest"] == sys.argv[2] and execution["exitCode"] == 0
          PY
          "$rcc" --no-build task run --robot "$PWD/robot.yaml" --task Doctor --dev --silent
          source="$PWD/devdata/synthetic-source"
          haul="$RUNNER_TEMP/linux-release-jat.tar.zst"
          python3 - "$RUNNER_TEMP/linux-release-build.json" "$source" "$haul" <<'PY'
          import json, sys
          json.dump({"folder":sys.argv[2],"output":sys.argv[3],"rcc_environment":"off"},open(sys.argv[1],"w"))
          PY
          "$rcc" --no-build task run --robot "$PWD/robot.yaml" --task Build -- --json-input "$RUNNER_TEMP/linux-release-build.json"
          python3 - "$RUNNER_TEMP/linux-release-restore.json" "$haul" "$RUNNER_TEMP/linux-release-restored" <<'PY'
          import json, sys
          json.dump({"haul":sys.argv[2],"destination":sys.argv[3]},open(sys.argv[1],"w"))
          PY
          "$rcc" --no-build task run --robot "$PWD/robot.yaml" --task Restore -- --json-input "$RUNNER_TEMP/linux-release-restore.json"
          python3 - "$RUNNER_TEMP/linux-release-serve.json" "$haul" <<'PY'
          import json, sys
          json.dump({"haul":sys.argv[2]},open(sys.argv[1],"w"))
          PY
          export JAT_RUN_DIR="$RUNNER_TEMP/linux-release-serve-runtime"
          mkdir -p "$JAT_RUN_DIR"
          "$rcc" --no-build task run --robot "$PWD/robot.yaml" --task Serve -- --json-input "$RUNNER_TEMP/linux-release-serve.json" > "$RUNNER_TEMP/linux-release-serve.log" 2>&1 &
          serve_pid=$!
          cleanup() { kill "$serve_pid" 2>/dev/null || true; wait "$serve_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          served="$RUNNER_TEMP/linux-release-served.tar.zst"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output "$served" --max-time 2 http://127.0.0.1:8080/joshs-all-the-things-workspace.tar.zst && [[ -s "$served" ]]; then ready=true; break; fi
            sleep 1
          done
          [[ "$ready" == true ]] || { cat "$RUNNER_TEMP/linux-release-serve.log"; exit 1; }

  verify-published-windows:
    if: github.event_name == 'workflow_dispatch'
    needs: publish-jat-runtime
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the exact merged JAT source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.JAT_RELEASE_SOURCE_SHA }}

      - name: Download the published Windows archive and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "jat-runtime-windows"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          & gh release download $env:JAT_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern jat-runtime-windows-amd64.rcca --pattern jat-runtime-windows-amd64.json --dir $releaseDir
          if ($LASTEXITCODE -ne 0) { throw "could not download published Windows runtime assets" }
          "RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify fresh Windows acquire, no-build, Hauler, and real JAT tasks
        run: |
          $archive = Join-Path $env:RELEASE_DIR "jat-runtime-windows-amd64.rcca"
          $receiptPath = Join-Path $env:RELEASE_DIR "jat-runtime-windows-amd64.json"
          $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
          if ($receipt.jat_git_sha -cne $env:JAT_RELEASE_SOURCE_SHA -or $receipt.hauler_version -cne "v2.1.1") { throw "Windows receipt source or Hauler version mismatch" }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $archive).Length
          if ($sha -cne $receipt.archive.sha256 -or $size -ne $receipt.archive.size) { throw "downloaded Windows archive does not match its receipt" }
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $PWD "runtime/rcc.json") | ConvertFrom-Json
          $pin = $manifest.platforms.windows_amd64
          $rcc = Join-Path $env:RUNNER_TEMP "release-rcc.exe"
          Invoke-WebRequest -Uri $pin.url -OutFile $rcc
          if ((Get-FileHash -Algorithm SHA256 -Path $rcc).Hash.ToLowerInvariant() -cne $pin.sha256) { throw "pinned RCC checksum mismatch" }
          if ((& $rcc version | Select-Object -First 1).Trim() -cne $manifest.version) { throw "pinned RCC version mismatch" }
          $env:ROBOCORP_HOME = Join-Path $env:RUNNER_TEMP "jat-release-windows-verifier"
          New-Item -ItemType Directory -Force -Path $env:ROBOCORP_HOME | Out-Null
          & $rcc env acquire --archive $archive --permissive-local --json 1> (Join-Path $env:RUNNER_TEMP "release-windows-acquire.json")
          if ($LASTEXITCODE -ne 0) { throw "fresh Windows release archive acquire failed" }
          $acquired = Get-Content -Raw (Join-Path $env:RUNNER_TEMP "release-windows-acquire.json") | ConvertFrom-Json
          if ($acquired.artifactDigest -ne $receipt.artifact_digest -or $acquired.verification.valid -ne $true) { throw "fresh Windows acquire did not validate the release artifact" }
          $artifact = $receipt.artifact_digest
          $env:PYTHONPATH = Join-Path $PWD "src"
          $variablesPath = Join-Path $env:RUNNER_TEMP "release-windows-vars.json"
          $variablesCode = "import json,os,sys; print(json.dumps({'conda_prefix':os.environ.get('CONDA_PREFIX'),'python':os.path.realpath(sys.executable)}))"
          & $rcc --no-build env exec --artifact $artifact --permissive-local -- python -c $variablesCode 1> $variablesPath
          if ($LASTEXITCODE -ne 0) { throw "Windows release no-build artifact variables failed" }
          $runtimeVariables = Get-Content -Raw $variablesPath | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($runtimeVariables.conda_prefix) -or -not $runtimeVariables.python.StartsWith($runtimeVariables.conda_prefix, [System.StringComparison]::OrdinalIgnoreCase)) { throw "Windows release variables did not come from the acquired artifact" }
          & $rcc --no-build env exec --artifact $artifact --permissive-local --json -- cmd.exe /d /c hauler.exe version 1> (Join-Path $env:RUNNER_TEMP "release-windows-hauler.exe.json")
          if ($LASTEXITCODE -ne 0) { throw "Windows release hauler.exe proof failed" }
          $haulerCode = "import os,shutil,subprocess,sys; e=shutil.which('hauler'); p=os.path.realpath(os.environ['CONDA_PREFIX']); r=os.path.realpath(e) if e else ''; result=subprocess.run([r,'version'],check=False,capture_output=True,text=True) if r.startswith(p+os.sep) else None; sys.exit(127 if result is None else (result.returncode if '2.1.1' in result.stdout else 1))"
          & $rcc --no-build env exec --artifact $artifact --permissive-local --json -- python -c $haulerCode 1> (Join-Path $env:RUNNER_TEMP "release-windows-hauler-python.json")
          if ($LASTEXITCODE -ne 0) { throw "Windows release environment-owned Hauler proof failed" }
          & $rcc --no-build env exec --artifact $artifact --permissive-local -- python -m jat.cli doctor --json
          if ($LASTEXITCODE -ne 0) { throw "JAT Doctor failed from the published Windows artifact" }
          $source = Join-Path $PWD "devdata/synthetic-source"
          $haul = Join-Path $env:RUNNER_TEMP "release-windows-jat.tar.zst"
          & $rcc --no-build env exec --artifact $artifact --permissive-local -- python -m jat.cli build --folder $source --output $haul --rcc-environment off --json
          if ($LASTEXITCODE -ne 0) { throw "JAT Build failed from the published Windows artifact" }
          $restore = Join-Path $env:RUNNER_TEMP "release-windows-restored"
          & $rcc --no-build env exec --artifact $artifact --permissive-local -- python -m jat.cli restore --haul $haul --destination $restore --json
          if ($LASTEXITCODE -ne 0) { throw "JAT Restore failed from the published Windows artifact" }
          $env:JAT_RUN_DIR = Join-Path $env:RUNNER_TEMP "release-windows-serve-runtime"
          New-Item -ItemType Directory -Force -Path $env:JAT_RUN_DIR | Out-Null
          $serveOut = Join-Path $env:RUNNER_TEMP "release-windows-serve.out"
          $serveErr = Join-Path $env:RUNNER_TEMP "release-windows-serve.err"
          $serveArgs = @("--no-build", "env", "exec", "--artifact", $artifact, "--permissive-local", "--", "python", "-m", "jat.cli", "serve", "--haul", $haul, "--mode", "files", "--fileserver-port", "8080", "--json")
          $serve = Start-Process -FilePath $rcc -ArgumentList $serveArgs -WorkingDirectory $PWD -RedirectStandardOutput $serveOut -RedirectStandardError $serveErr -PassThru
          $ready = $false
          $downloaded = Join-Path $env:RUNNER_TEMP "release-windows-served.tar.zst"
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if ($serve.HasExited) { Get-Content $serveOut, $serveErr; throw "JAT Serve exited before readiness" }
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:8080/joshs-all-the-things-workspace.tar.zst" -OutFile $downloaded -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop | Out-Null
              if ((Test-Path -LiteralPath $downloaded) -and (Get-Item -LiteralPath $downloaded).Length -gt 0) { $ready = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { Get-Content $serveOut, $serveErr; throw "JAT Serve did not serve the published artifact workspace" }
          & taskkill.exe /PID $serve.Id /T /F | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not stop the Windows release Serve process" }
