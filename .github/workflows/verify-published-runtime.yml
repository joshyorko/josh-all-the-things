name: Verify published JAT runtime

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact original source commit recorded by the immutable release
        required: true
        type: string
      release_tag:
        description: Existing immutable runtime release to verify, never publish
        default: v0.1.15-jat-runtime
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  contents: read

env:
  JAT_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
  JAT_RELEASE_TAG: ${{ inputs.release_tag }}
  JAT_VERIFIER_CODE_SHA: ${{ github.workflow_sha }}

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate immutable release identity before executing its source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$JAT_RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$JAT_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-jat-runtime$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$JAT_RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PYTHON'
          import json, os, sys
          release = json.load(open(sys.argv[1]))
          assert release["immutable"] is True, "release must already be immutable"
          assert release["draft"] is False, "release must already be published"
          assert release["tag_name"] == os.environ["JAT_RELEASE_TAG"]
          PYTHON
          refs=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/${JAT_RELEASE_TAG}" "refs/tags/${JAT_RELEASE_TAG}^{}")
          tag_sha=$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ {print $1; found=1} END {if (!found) exit 1}') || tag_sha=$(printf '%s\n' "$refs" | awk 'NR == 1 {print $1}')
          test "$tag_sha" = "$JAT_RELEASE_SOURCE_SHA"
          {
            echo "Release: $JAT_RELEASE_TAG"
            echo "Original runtime source: $JAT_RELEASE_SOURCE_SHA"
            echo "Verifier code: $JAT_VERIFIER_CODE_SHA"
            echo "This workflow only reads an existing immutable release."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published-linux:
    needs: validate-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted verifier code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.JAT_VERIFIER_CODE_SHA }}
          persist-credentials: false

      - name: Stage trusted receipt and runtime validators
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("validate_runtime_receipt.py", "verify_hauler_runtime.py", "verify_jat_serve.py", "runtime-verifier-requirements.txt"):
              shutil.copyfile(pathlib.Path("scripts") / name, root / name)
          subprocess.run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--target", str(root / "jat-receipt-tools"), "--requirement", str(root / "runtime-verifier-requirements.txt")], check=True)

      - name: Checkout the exact merged JAT source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.JAT_RELEASE_SOURCE_SHA }}
          persist-credentials: false

      - name: Download the published Linux archive and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jat-runtime-linux"
          gh release download "$JAT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern jat-runtime-linux-amd64.rcca \
            --pattern jat-runtime-linux-amd64.json \
            --dir "$RUNNER_TEMP/jat-runtime-linux"

      - name: Validate the complete Linux producer receipt
        env:
          PYTHONPATH: ${{ runner.temp }}/jat-receipt-tools
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/validate_runtime_receipt.py" \
            --source-root "$GITHUB_WORKSPACE" --source-sha "$JAT_RELEASE_SOURCE_SHA" --platform linux_amd64 \
            --archive "$RUNNER_TEMP/jat-runtime-linux/jat-runtime-linux-amd64.rcca" \
            --receipt "$RUNNER_TEMP/jat-runtime-linux/jat-runtime-linux-amd64.json"

      - name: Verify fresh Linux acquire, no-build, Hauler, and real JAT tasks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/jat-runtime-linux/jat-runtime-linux-amd64.rcca"
          receipt="$RUNNER_TEMP/jat-runtime-linux/jat-runtime-linux-amd64.json"
          mapfile -t pin < <(python3 -c 'import json; p=json.load(open("runtime/rcc.json")); x=p["platforms"]["linux_amd64"]; print(p["version"]); print(x["url"]); print(x["sha256"])')
          rcc="$RUNNER_TEMP/rcc"
          curl --fail --location --silent --show-error --retry 3 "${pin[1]}" --output "$rcc"
          printf '%s  %s\n' "${pin[2]}" "$rcc" | sha256sum --check --status -
          chmod 0755 "$rcc"
          [[ "$($rcc version | head -n 1)" == "${pin[0]}" ]]
          export ROBOCORP_HOME="$RUNNER_TEMP/jat-release-linux-verifier"
          mkdir -p "$ROBOCORP_HOME"
          "$rcc" env acquire --archive "$archive" --permissive-local --json > "$RUNNER_TEMP/linux-release-acquire.json"
          artifact=$(python3 -c 'import json; print(json.load(open("'"$receipt"'"))["artifact_digest"])')
          python3 - "$RUNNER_TEMP/linux-release-acquire.json" "$artifact" <<'PY'
          import json, sys
          acquired = json.load(open(sys.argv[1]))
          assert acquired["artifactDigest"] == sys.argv[2] and acquired["verification"]["valid"] is True
          PY
          verify_execution() {
            python3 - "$1" "$artifact" <<'PY'
          import json, sys
          execution = json.load(open(sys.argv[1]))
          if execution["artifactDigest"] != sys.argv[2] or execution["exitCode"] != 0 or execution["verification"]["valid"] is not True:
              raise SystemExit("execution did not verify the acquired release artifact")
          PY
          }
          "$rcc" --no-build env exec --artifact "$artifact" --permissive-local --inherit-streams --receipt-file "$RUNNER_TEMP/linux-release-no-build.json" -- python -c "print('jat-release-no-build-proof')"
          verify_execution "$RUNNER_TEMP/linux-release-no-build.json"
          expected_hauler=$(python3 -c 'import json; print(json.load(open("runtime/hauler.json"))["hauler"]["version"])')
          "$rcc" --no-build env exec --artifact "$artifact" --permissive-local --inherit-streams --receipt-file "$RUNNER_TEMP/linux-release-hauler.json" -- python "$RUNNER_TEMP/verify_hauler_runtime.py" --expected-version "$expected_hauler"
          verify_execution "$RUNNER_TEMP/linux-release-hauler.json"
          export PYTHONPATH="$PWD/src:$PWD"
          "$rcc" --no-build env exec --artifact "$artifact" --permissive-local --inherit-streams --receipt-file "$RUNNER_TEMP/linux-release-doctor.json" -- env PYTHONPATH="$PWD/src:$PWD" python -m jat.cli doctor --json
          verify_execution "$RUNNER_TEMP/linux-release-doctor.json"
          source="$PWD/devdata/synthetic-source"
          haul="$RUNNER_TEMP/linux-release-jat.tar.zst"
          "$rcc" --no-build env exec --artifact "$artifact" --permissive-local --inherit-streams --receipt-file "$RUNNER_TEMP/linux-release-build.json" -- env PYTHONPATH="$PWD/src:$PWD" python -m jat.cli build --folder "$source" --output "$haul" --rcc-environment off --json
          verify_execution "$RUNNER_TEMP/linux-release-build.json"
          "$rcc" --no-build env exec --artifact "$artifact" --permissive-local --inherit-streams --receipt-file "$RUNNER_TEMP/linux-release-restore.json" -- env PYTHONPATH="$PWD/src:$PWD" python -m jat.cli restore --haul "$haul" --destination "$RUNNER_TEMP/linux-release-restored" --json
          verify_execution "$RUNNER_TEMP/linux-release-restore.json"
          export JAT_RUN_DIR="$RUNNER_TEMP/linux-release-serve-runtime"
          mkdir -p "$JAT_RUN_DIR"
          "$rcc" --no-build env exec --artifact "$artifact" --permissive-local --inherit-streams --receipt-file "$RUNNER_TEMP/linux-release-serve.json" -- env PYTHONPATH="$PWD/src:$PWD" python "$RUNNER_TEMP/verify_jat_serve.py" --haul "$haul" --output "$RUNNER_TEMP/linux-release-serve-proof"
          verify_execution "$RUNNER_TEMP/linux-release-serve.json"


      - name: Record Linux verification identity
        if: always()
        run: |
          printf 'release_tag=%s\nrelease_source_sha=%s\nverifier_code_sha=%s\n' "$JAT_RELEASE_TAG" "$JAT_RELEASE_SOURCE_SHA" "$JAT_VERIFIER_CODE_SHA" > "$RUNNER_TEMP/linux-release-identity.txt"

      - name: Upload Linux postpublication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jat-published-linux-verification
          path: |
            ${{ runner.temp }}/linux-release-*.json
            ${{ runner.temp }}/linux-release-*.log
            ${{ runner.temp }}/linux-release-identity.txt
            ${{ runner.temp }}/linux-release-serve-proof/
            ${{ runner.temp }}/jat-runtime-linux/*.json

  verify-published-windows:
    needs: validate-release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout trusted verifier code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.JAT_VERIFIER_CODE_SHA }}
          persist-credentials: false

      - name: Stage trusted receipt and runtime validators
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("validate_runtime_receipt.py", "verify_hauler_runtime.py", "verify_jat_serve.py", "runtime-verifier-requirements.txt"):
              shutil.copyfile(pathlib.Path("scripts") / name, root / name)
          subprocess.run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--target", str(root / "jat-receipt-tools"), "--requirement", str(root / "runtime-verifier-requirements.txt")], check=True)

      - name: Checkout the exact merged JAT source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.JAT_RELEASE_SOURCE_SHA }}
          persist-credentials: false

      - name: Download the published Windows archive and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "jat-runtime-windows"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          & gh release download $env:JAT_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern jat-runtime-windows-amd64.rcca --pattern jat-runtime-windows-amd64.json --dir $releaseDir
          if ($LASTEXITCODE -ne 0) { throw "could not download published Windows runtime assets" }
          "RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate the complete Windows producer receipt
        env:
          PYTHONPATH: ${{ runner.temp }}/jat-receipt-tools
        run: |
          python "$env:RUNNER_TEMP/validate_runtime_receipt.py" --source-root "$env:GITHUB_WORKSPACE" --source-sha "$env:JAT_RELEASE_SOURCE_SHA" --platform windows_amd64 --archive "$env:RELEASE_DIR/jat-runtime-windows-amd64.rcca" --receipt "$env:RELEASE_DIR/jat-runtime-windows-amd64.json"
          if ($LASTEXITCODE -ne 0) { throw "Windows producer receipt validation failed" }

      - name: Verify fresh Windows acquire, no-build, Hauler, and real JAT tasks
        run: |
          $archive = Join-Path $env:RELEASE_DIR "jat-runtime-windows-amd64.rcca"
          $receiptPath = Join-Path $env:RELEASE_DIR "jat-runtime-windows-amd64.json"
          $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $PWD "runtime/rcc.json") | ConvertFrom-Json
          $pin = $manifest.platforms.windows_amd64
          $rcc = Join-Path $env:RUNNER_TEMP "release-rcc.exe"
          Invoke-WebRequest -Uri $pin.url -OutFile $rcc
          if ((Get-FileHash -Algorithm SHA256 -Path $rcc).Hash.ToLowerInvariant() -cne $pin.sha256) { throw "pinned RCC checksum mismatch" }
          if ((& $rcc version | Select-Object -First 1).Trim() -cne $manifest.version) { throw "pinned RCC version mismatch" }
          $env:ROBOCORP_HOME = Join-Path $env:RUNNER_TEMP "jat-release-windows-verifier"
          New-Item -ItemType Directory -Force -Path $env:ROBOCORP_HOME | Out-Null
          & $rcc env acquire --archive $archive --permissive-local --json 1> (Join-Path $env:RUNNER_TEMP "release-windows-acquire.json")
          if ($LASTEXITCODE -ne 0) { throw "fresh Windows release archive acquire failed" }
          $acquired = Get-Content -Raw (Join-Path $env:RUNNER_TEMP "release-windows-acquire.json") | ConvertFrom-Json
          if ($acquired.artifactDigest -ne $receipt.artifact_digest -or $acquired.verification.valid -ne $true) { throw "fresh Windows acquire did not validate the release artifact" }
          if ($receipt.platform -cne "windows_amd64" -or $receipt.rcc_version -cne $manifest.version -or $receipt.rcc_source.commit -cne $manifest.source.commit) { throw "Windows receipt runtime identity mismatch" }
          $artifact = $receipt.artifact_digest
          $env:PYTHONPATH = Join-Path $PWD "src"
          $variablesPath = Join-Path $env:RUNNER_TEMP "release-windows-vars.json"
          $variablesCode = "import json,os,sys; print(json.dumps({'conda_prefix':os.environ.get('CONDA_PREFIX'),'python':os.path.realpath(sys.executable)}))"
          function Assert-ExecutionReceipt([string]$Path) {
            $execution = Get-Content -Raw -LiteralPath $Path | ConvertFrom-Json
            if ($execution.artifactDigest -cne $artifact -or $execution.exitCode -ne 0 -or $execution.verification.valid -ne $true) {
              throw "execution did not validate the acquired artifact: $Path"
            }
          }
          $variablesReceipt = Join-Path $env:RUNNER_TEMP "release-windows-variables-receipt.json"
          & $rcc --no-build env exec --artifact $artifact --permissive-local --inherit-streams --receipt-file $variablesReceipt -- python -c $variablesCode 1> $variablesPath
          if ($LASTEXITCODE -ne 0) { throw "Windows release no-build artifact variables failed" }
          Assert-ExecutionReceipt $variablesReceipt
          $runtimeVariables = Get-Content -Raw $variablesPath | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($runtimeVariables.conda_prefix) -or -not $runtimeVariables.python.StartsWith($runtimeVariables.conda_prefix, [System.StringComparison]::OrdinalIgnoreCase)) { throw "Windows release variables did not come from the acquired artifact" }
          $haulerReceipt = Join-Path $env:RUNNER_TEMP "release-windows-hauler-receipt.json"
          & $rcc --no-build env exec --artifact $artifact --permissive-local --inherit-streams --receipt-file $haulerReceipt -- cmd.exe /d /c hauler.exe version 1> (Join-Path $env:RUNNER_TEMP "release-windows-hauler.exe.log")
          if ($LASTEXITCODE -ne 0) { throw "Windows release hauler.exe proof failed" }
          Assert-ExecutionReceipt $haulerReceipt
          $expectedHauler = (Get-Content -Raw runtime/hauler.json | ConvertFrom-Json).hauler.version
          $haulerPythonReceipt = Join-Path $env:RUNNER_TEMP "release-windows-haulerPython-receipt.json"
          & $rcc --no-build env exec --artifact $artifact --permissive-local --inherit-streams --receipt-file $haulerPythonReceipt -- python "$env:RUNNER_TEMP/verify_hauler_runtime.py" --expected-version $expectedHauler 1> (Join-Path $env:RUNNER_TEMP "release-windows-hauler-python.log")
          if ($LASTEXITCODE -ne 0) { throw "Windows release environment-owned Hauler proof failed" }
          Assert-ExecutionReceipt $haulerPythonReceipt
          $doctorReceipt = Join-Path $env:RUNNER_TEMP "release-windows-doctor-receipt.json"
          & $rcc --no-build env exec --artifact $artifact --permissive-local --inherit-streams --receipt-file $doctorReceipt -- python -m jat.cli doctor --json
          if ($LASTEXITCODE -ne 0) { throw "JAT Doctor failed from the published Windows artifact" }
          Assert-ExecutionReceipt $doctorReceipt
          $source = Join-Path $PWD "devdata/synthetic-source"
          $haul = Join-Path $env:RUNNER_TEMP "release-windows-jat.tar.zst"
          $buildReceipt = Join-Path $env:RUNNER_TEMP "release-windows-build-receipt.json"
          & $rcc --no-build env exec --artifact $artifact --permissive-local --inherit-streams --receipt-file $buildReceipt -- python -m jat.cli build --folder $source --output $haul --rcc-environment off --json
          if ($LASTEXITCODE -ne 0) { throw "JAT Build failed from the published Windows artifact" }
          Assert-ExecutionReceipt $buildReceipt
          $restore = Join-Path $env:RUNNER_TEMP "release-windows-restored"
          $restoreReceipt = Join-Path $env:RUNNER_TEMP "release-windows-restore-receipt.json"
          & $rcc --no-build env exec --artifact $artifact --permissive-local --inherit-streams --receipt-file $restoreReceipt -- python -m jat.cli restore --haul $haul --destination $restore --json
          if ($LASTEXITCODE -ne 0) { throw "JAT Restore failed from the published Windows artifact" }
          Assert-ExecutionReceipt $restoreReceipt
          $env:JAT_RUN_DIR = Join-Path $env:RUNNER_TEMP "release-windows-serve-runtime"
          New-Item -ItemType Directory -Force -Path $env:JAT_RUN_DIR | Out-Null
          # Let the supervised probe exit normally so RCC can persist its receipt.
          # Killing RCC itself would lose the receipt and bypass that final check.
          $serveReceipt = Join-Path $env:RUNNER_TEMP "release-windows-serve-receipt.json"
          & $rcc --no-build env exec --artifact $artifact --permissive-local --inherit-streams --receipt-file $serveReceipt -- python "$env:RUNNER_TEMP/verify_jat_serve.py" --haul $haul --output "$env:RUNNER_TEMP/release-windows-serve-proof"
          if ($LASTEXITCODE -ne 0) { throw "JAT Serve probe failed from the published Windows artifact" }
          Assert-ExecutionReceipt $serveReceipt

      - name: Record Windows verification identity
        if: always()
        run: |
          @{
            release_tag = $env:JAT_RELEASE_TAG
            release_source_sha = $env:JAT_RELEASE_SOURCE_SHA
            verifier_code_sha = $env:JAT_VERIFIER_CODE_SHA
          } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP "release-windows-identity.json")

      - name: Upload Windows postpublication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jat-published-windows-verification
          path: |
            ${{ runner.temp }}/release-windows-*.json
            ${{ runner.temp }}/release-windows-*.log
            ${{ runner.temp }}/release-windows-serve-proof/
            ${{ runner.temp }}/jat-runtime-windows/*.json
