# For more details on the format and content:
# https://github.com/joshyorko/rcc/blob/master/docs/recipes.md#what-is-in-robotyaml

tasks:
  Build:
    shell: python -m jat.task_runner run tasks.py -t Build --
  Restore:
    shell: python -m jat.task_runner run tasks.py -t Restore --
  Serve:
    shell: python -m jat.task_runner run tasks.py -t Serve --
  JAT:
    shell: python -m jat.cli

devTasks:
  Doctor:
    shell: python -m jat.task_runner run tasks.py -t Doctor --

environmentConfigs:
  - environment_windows_amd64_freeze.yaml
  - environment_linux_amd64_freeze.yaml
  - environment_darwin_amd64_freeze.yaml
  - conda.yaml

artifactsDir: output

preRunScripts:
  - bash scripts/install_dependencies.sh 1

PATH:
  - .
PYTHONPATH:
  - src
  - .
ignoreFiles:
  - .gitignore
