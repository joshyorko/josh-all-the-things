# For more details on the format and content:
# https://github.com/joshyorko/rcc/blob/master/docs/recipes.md#what-is-in-condayaml
# Tip: Adding a link to the release notes of the packages helps maintenance and security.

channels:
  - conda-forge

dependencies:
  - python=3.13.11                 # https://www.python.org/downloads/release/python-31311/
  - uv=0.12.1                      # https://github.com/astral-sh/uv/releases/tag/0.12.1
  - bash
  - coreutils
  - curl
  - git
  - gzip
  - pip
  - tar
  - zstd
  - pip:
      - robocorp==3.1.1            # https://pypi.org/project/robocorp/3.1.1/
      - robocorp-log==3.1.3        # https://pypi.org/project/robocorp-log/3.1.3/
      - robocorp-truststore==0.9.1 # https://pypi.org/project/robocorp-truststore/0.9.1/
      - pydantic==2.12.5
      - pytest==9.1.1
      - ruff==0.16.4
